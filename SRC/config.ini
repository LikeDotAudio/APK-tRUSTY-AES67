# AES67 / SMPTE ST 2110-30 transmitter + receiver, bridged to an ALSA sound card.
# Published to MQTT (retained) by apk-plugin-runner at <topic>/config.
#
# THESE ARE FIRST-BOOT DEFAULTS. Every key below is read by one function,
# `config::Settings::from_ini`, and ONLY when the writable settings file
# (APK_AES67_STATE, default /var/lib/apkaudio/aes67/settings.json) does not
# exist yet. After the first save from the web page (/config) or a PUT to
# /api/settings, that file is the truth and this one is only what a factory
# reset returns to.
[aes67]
enabled = true
# Session-name prefix in SDP and SAP. Empty means the host name.
node_name =
# Network interface for PTP, RTP and SAP. Empty means the first interface that
# is up, multicast-capable and not loopback or a container bridge.
interface =
# 48000 is the AES67 mandatory rate; 96000 and 44100 are allowed.
sample_rate = 48000
# `ptp` runs the built-in PTPv2 (IEEE 1588-2008) slave; `system` trusts
# CLOCK_TAI, which is right only when the host runs ptp4l + phc2sys.
clock_source = ptp
ptp_domain = 0
# ALSA device names as cpal lists them (GET /api/devices). Empty = the default.
capture_device =
playback_device =
# 0 means the device's own default channel count.
capture_channels = 0
playback_channels = 0
# SAP (RFC 2974) on 239.255.255.255:9875: announce our sources, browse others.
sap_announce = true
sap_listen = true
sap_interval_s = 30
# SAP group / port / TTL / forget-after — read by config.rs Settings::from_ini.
sap_group = 239.255.255.255
sap_port = 9875
sap_ttl = 32
sap_timeout_s = 300
# The slot plan: this many senders and receivers are created, disabled, on
# first boot. Both are capped at 16, and every stream at 8 channels.
source_slots = 16
sink_slots = 16
# The configuration and status pages, and the REST API behind them.
# APK_AES67_HTTP_PORT overrides it.
http_port = 8130
# RTSP server for RAVENNA DESCRIBE — read by config.rs Settings::from_ini; advertised over mDNS.
rtsp_port = 8554

# MQTT address this file is published to, RETAINED, as `<topic>/config` --
# and `<topic>/status`, `<topic>/host` beside it. The reader is
# apk-plugin-runner (`module_topic`). Nothing else in this crate reads it.
topic = APK.audio/System/Protocols/aes67

# NO topic_listen / topic_publish / topic_ignore. The daemon publishes
# `<topic>/Agent/*` (the contract's agent report) and `<topic>/Stream/*`,
# `<topic>/Clock`, `<topic>/Audio` (QoS 0, not retained, restated every 5 s),
# and listens on `<topic>/outgoing/command` — all built in `bus.rs`.
