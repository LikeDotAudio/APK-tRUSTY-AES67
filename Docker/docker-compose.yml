# PLUGIN.AES67 — AES67 / SMPTE ST 2110-30 senders and receivers bridged to an ALSA sound card, one container.
#
# STARTED BY THE RUNNER WITH THE REST OF THE PLUGINS. DISCOVERY.Engine/Docker/docker-compose.yml
# `include:`s this file, and DockTor reads the plugin roles off those files'
# `profiles:` (_common.sh::plugin_roles_declared), so `sound` and `aes67` are in the
# default role list and an ordinary mount builds and starts it:
#     python3 'PODS/POD.manager/MANAGER.Docktor/bin/K8:runner.py' up
#     xdg-open https://apk.local/plugins/aes67/ui/config   # 16 senders × 16 receivers, up to 8 channels each
#     (or http://127.0.0.1:8130/config on the bench itself — the listener is loopback-only)
# By hand, alone (the same service, no other plugin):
#     COMPOSE_PROFILES=aes67 docker compose -f 'PODS/POD.THICK/PLUGINS/PLUGIN.AES67/Docker/docker-compose.yml' up -d --build
# The image, the capability floor, the broker variables and the healthcheck are
# the base service in DISCOVERY.Engine/Docker/plugin-base.yml; this file says only
# what is THIS plugin's.

# ONE PROJECT WITH THE REST (`apk-audio`), so the plugins clump with the node.
name: apk-audio

# IN THE POD: the discovery engine's compose file must `include:` this one, and
# DockTor's K8/plugin-includes.sh fails when it does not (PLAN-3395.01).
x-apk-plugin: true

# THE SHARED PLUGIN VOLUMES (apk-audio-logs, mac-lookup-cache) are declared once,
# in the engine's plugin-volumes.yml — identical to their owners' declarations —
# and included here instead of copied (2026-10-30 audit).
include:
  - path: "../../../DISCOVERY.Engine/Docker/plugin-volumes.yml"

services:
  # ONE-SHOT, BEFORE THE PLUGIN: loads the host's snd-aloop so the network is
  # a sound card in the desktop (SRC/loopback/aes67-loopback.sh). The only
  # container here with a kernel capability, and it has nothing else: no
  # network, read-only root, the host's modules read-only, gone in a second.
  # It always exits 0, so a host that refuses the module still gets the plugin.
  aes67-loopback:
    # Context is this repo's own SRC/: the image needs one script from it and
    # nothing else (2026-10-30 audit), so the repo builds it alone.
    build:
      context: "../SRC"
      dockerfile: "../Docker/Dockerfile.loopback"
    image: apk-aes67-loopback:local
    container_name: Plugin-AES67-Loopback
    # WHAT THIS IS, said by the container itself (PLAN-3409.01): DockTor reads
    # these with docker inspect, so its purpose and endpoint panes keep no list.
    labels:
      audio.apk.purpose: "One-shot: loads the host's snd-aloop virtual sound card for AES67"
      audio.apk.purpose.what: "aes67-loopback runs once before Plugin-AES67 with CAP_SYS_MODULE, no network and the host's /lib/modules read-only: modprobe snd-aloop id=AES67 unless that card exists. Always exits 0 — Exited (0) is its healthy state."
      audio.apk.purpose.why: "It is what makes the AES67 network appear in the desktop's sound settings as 'Loopback'. Without it the plugin still runs, on physical cards only."
    profiles: [sound, aes67]
    restart: "no"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    user: root
    cap_drop: [ALL]
    cap_add: [SYS_MODULE]
    environment:
      APK_AES67_LOOPBACK: ${APK_AES67_LOOPBACK:-on}
      APK_AES67_LOOPBACK_ID: ${APK_AES67_LOOPBACK_ID:-AES67}
      APK_AES67_LOOPBACK_SUBSTREAMS: ${APK_AES67_LOOPBACK_SUBSTREAMS:-1}
    volumes:
      - /lib/modules:/lib/modules:ro

  aes67:
    extends:
      file: "../../../DISCOVERY.Engine/Docker/plugin-base.yml"
      service: plugin-host
    container_name: Plugin-AES67
    # WHAT THIS IS, said by the container itself (PLAN-3409.01): DockTor reads
    # these with docker inspect, so its purpose and endpoint panes keep no list.
    labels:
      audio.apk.purpose: "AES67 / SMPTE ST 2110-30 senders and receivers on a sound card"
      audio.apk.purpose.what: "apk-aes67 on host networking with /dev/snd: 16 senders and 16 receivers of up to 8 channels each, a user-space PTPv2 slave on UDP 319/320 (NET_BIND_SERVICE), SAP announce and browse, and its own pages at :8130/status and :8130/config. Settings live on the apk-audio-aes67-state volume."
      audio.apk.purpose.why: "It puts this machine's sound card on the AES67 / ST 2110 network: capture channels out as multicast streams, and other devices' streams out of its outputs."
      audio.apk.endpoint.1: "open http://127.0.0.1:${APK_AES67_HTTP_PORT:-8130}/status AES67 / ST 2110-30 status"
      audio.apk.endpoint.2: "open http://127.0.0.1:${APK_AES67_HTTP_PORT:-8130}/config AES67 / ST 2110-30 configuration"
    command: ["apk-aes67"]
    # AFTER the loopback card exists: `devices: /dev/snd` is resolved when the
    # container is CREATED, so a card that appears later is not in it.
    depends_on:
      aes67-loopback:
        condition: service_completed_successfully
    # `sound` because it opens the card, like SOUNDCARD_IN/OUT; `aes67` so it
    # can be raised alone.
    profiles: [sound, aes67]
    # PTP's UDP 319/320 are below 1024. The binary carries the matching FILE
    # capability (DISCOVERY.Engine/Docker/Dockerfile); without this line it is not in
    # the bounding set and the daemon falls back to CLOCK_TAI, saying so.
    cap_add: [NET_BIND_SERVICE]
    # The card, and only this container's.
    devices:
      - /dev/snd:/dev/snd
    group_add: [audio]
    environment:
      APK_AES67_HTTP_PORT: ${APK_AES67_HTTP_PORT:-8130}
      # LOOPBACK (PLAN-3403.01). Host networking makes 0.0.0.0 every interface on
      # the bench; the browser's way in is Portal-Gateway's /plugins/aes67/ui/,
      # through NODE.BareMetal's relay socket. Widen deliberately, never by default.
      APK_AES67_HTTP_BIND: ${APK_AES67_HTTP_BIND:-127.0.0.1}
      # Set it and every PUT/POST/DELETE on the API needs `Authorization: Bearer <token>`.
      APK_AES67_TOKEN: ${APK_AES67_TOKEN:-}
      APK_AES67_STATE: /var/lib/apkaudio/aes67/settings.json
    volumes:
      # THE ONE WRITABLE PLACE: what /config saves. The root is read-only.
      - type: volume
        source: aes67-state
        target: /var/lib/apkaudio/aes67

volumes:
  # THIS PLUGIN'S OWN VOLUME: what /config saves (the deliberate exception —
  # its own port 8130 and its own state). The shared plugin volumes
  # (apk-audio-logs, mac-lookup-cache) come from the include above.
  aes67-state:
    name: apk-audio-aes67-state
